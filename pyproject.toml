[project]
name = "polynomial-learnings"
version = "0.1.0"
description = "Framework-agnostic long-term learning module for AI agents — vector ingestion and retrieval on Postgres + pgvector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[project.optional-dependencies]
huggingface = ["sentence-transformers>=2.2"]
pydantic-ai = ["pydantic-ai>=0.0.14"]
dev = ["pytest>=8.0", "sentence-transformers>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learnings"]
