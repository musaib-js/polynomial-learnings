[project]
name = "polynomial-learnings"
version = "0.1.0"
description = "Framework-agnostic long-term learning module for AI agents — vector ingestion and retrieval on Postgres + pgvector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
huggingface = ["sentence-transformers>=2.2"]
pydantic-ai = ["pydantic-ai>=0.0.14", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
client = ["httpx>=0.27"]
groq = ["groq>=0.11"]
# SaaS tenancy/auth layer (learnings/auth/, learnings/api/auth_routes.py,
# dashboard_routes.py). Kept as its own extra since self-hosted/library-only
# consumers of `learnings` don't need auth/JWT/migration tooling.
saas = [
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "sentence-transformers>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "groq>=0.11",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learnings"]
