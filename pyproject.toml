[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polynomial-learnings"
version = "0.1.0"
description = "Framework-agnostic long-term learning module for AI agents — vector ingestion and retrieval on Postgres + pgvector."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["agents", "memory", "learnings", "pgvector", "retrieval", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
huggingface = ["sentence-transformers>=2.2"]
pydantic-ai = ["pydantic-ai>=0.0.14", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
client = ["httpx>=0.27"]
groq = ["groq>=0.11"]
all = [
    "sentence-transformers>=2.2",
    "pydantic-ai>=0.0.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "groq>=0.11",
]
dev = [
    "pytest>=8.0",
    "sentence-transformers>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "groq>=0.11",
]

[project.urls]
Repository = "https://github.com/musaib-js/polynomial-learnings"

[tool.setuptools.package-data]
learnings = ["*.sql"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ so the suite runs against a plain checkout,
# with or without an editable install.
pythonpath = ["src"]
